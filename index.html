<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>急診 Leader 交班系統</title>
<style>
  :root {
    /* 主色:深藍綠(專業、未來感不浮誇) */
    --accent: #00a6a0;
    --accent-d: #007a76;
    --accent-bg: #e8f7f6;
    /* 背景層次 */
    --bg: #f4f6f8;
    --bg2: #fff;
    --bg3: #eaeef2;
    --bg-dark: #0f1820;
    --bg-dark2: #1a2530;
    /* 文字 */
    --text: #1a1a1a;
    --text2: #5a6470;
    --text3: #8a949e;
    --text-on-dark: #e8eef2;
    --text2-on-dark: #93a0ad;
    /* 框線 */
    --border: #dde2e8;
    --border2: #c7cdd4;
    /* 語意 */
    --red-bg: #fdebeb; --red-text: #c0382b; --red-bd: #e8b3ae;
    --amber-bg: #fff4dc; --amber-text: #a06800; --amber-bd: #e8c98e;
    --blue-bg: #e6f0fb; --blue-text: #1255b0;
    --green-bg: #e6f7ec; --green-text: #0a7a3b;
    --gray-bg: #eef0f3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; color: var(--text); background: var(--bg); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font-family: inherit; font-size: 15px; }
  button { padding: 8px 14px; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: all 0.15s; font-weight: 500; }
  button:hover { background: var(--bg3); border-color: var(--border2); }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { background: var(--accent-d); border-color: var(--accent-d); }
  button.danger { color: var(--red-text); border-color: var(--red-bd); background: #fff; }
  button.danger:hover { background: var(--red-bg); }
  input, select, textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg2); color: var(--text); font-size: 15px; transition: border-color 0.15s, box-shadow 0.15s; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,166,160,0.15); }
  label { display: block; font-size: 13px; color: var(--text2); margin: 12px 0 5px; font-weight: 500; }

  /* ======== 登入頁 ======== */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-dark2) 100%); }
  .login-box { background: var(--bg2); padding: 36px 32px; border-radius: 16px; width: 380px; max-width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
  .login-box h1 { font-size: 22px; margin-bottom: 6px; color: var(--text); font-weight: 600; }
  .login-box .sub { font-size: 13px; color: var(--text2); margin-bottom: 24px; }
  .login-box label { font-size: 13px; }
  .login-box input { font-size: 16px; padding: 11px 14px; }
  .login-box .err { color: var(--red-text); font-size: 13px; margin-top: 10px; }
  .login-box .submit { width: 100%; margin-top: 22px; padding: 12px; font-size: 16px; }

  /* ======== App 主框架 ======== */
  .layout { display: flex; min-height: 100vh; }

  /* 左側 sidebar */
  .sidebar { width: 220px; background: var(--bg-dark); color: var(--text-on-dark); display: flex; flex-direction: column; flex-shrink: 0; position: sticky; top: 0; height: 100vh; }
  .sidebar-brand { padding: 20px 18px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .sidebar-brand .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .sidebar-brand .logo-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  .sidebar-brand .title { font-size: 14px; font-weight: 600; letter-spacing: 0.02em; }
  .sidebar-brand .sub { font-size: 11px; color: var(--text2-on-dark); margin-top: 2px; }

  .sidebar-nav { flex: 1; padding: 12px 8px; overflow-y: auto; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; color: var(--text-on-dark); font-size: 14px; margin-bottom: 2px; transition: background 0.15s; position: relative; }
  .nav-item:hover { background: rgba(255,255,255,0.06); }
  .nav-item.active { background: var(--accent); color: #fff; font-weight: 600; }
  .nav-item.active::before { content: ''; position: absolute; left: -8px; top: 8px; bottom: 8px; width: 3px; background: var(--accent); border-radius: 0 3px 3px 0; }
  .nav-icon { width: 20px; height: 20px; flex-shrink: 0; opacity: 0.85; }
  .nav-item.active .nav-icon { opacity: 1; }
  .nav-label { flex: 1; }
  .nav-badge { background: var(--red-text); color: #fff; font-size: 11px; padding: 1px 7px; border-radius: 10px; font-weight: 600; }

  .sidebar-foot { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 12px; color: var(--text2-on-dark); }
  .sidebar-foot .who { color: var(--text-on-dark); font-weight: 600; font-size: 13px; }
  .sidebar-foot .role-tag { display: inline-block; padding: 1px 7px; background: rgba(0,166,160,0.2); color: var(--accent); border-radius: 10px; font-size: 10px; margin-left: 6px; font-weight: 600; }
  .sidebar-foot button { background: transparent; border: 1px solid rgba(255,255,255,0.15); color: var(--text-on-dark); margin-top: 8px; width: 100%; padding: 7px; font-size: 13px; }
  .sidebar-foot button:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.3); }

  /* 主內容區 */
  .main { flex: 1; min-width: 0; padding: 20px 28px 100px; max-width: 1200px; margin: 0 auto; width: 100%; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .topbar h2 { font-size: 22px; font-weight: 600; }
  .topbar .time { font-size: 13px; color: var(--text2); font-variant-numeric: tabular-nums; }

  /* 摘要卡片 */
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .stat { background: var(--bg2); border-radius: 10px; padding: 12px 14px; cursor: pointer; border: 1px solid var(--border); transition: all 0.15s; }
  .stat:hover { border-color: var(--accent); transform: translateY(-1px); }
  .stat.urgent { background: var(--red-bg); border-color: var(--red-bd); }
  .stat.urgent .l, .stat.urgent .n { color: var(--red-text); }
  .stat .l { font-size: 12px; color: var(--text2); font-weight: 500; }
  .stat .n { font-size: 26px; font-weight: 600; line-height: 1.1; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .stat .n .total { font-size: 14px; color: var(--text3); font-weight: 400; }

  /* 待批准列 */
  .pending-bar { background: linear-gradient(90deg, #fff8e7 0%, #fff4dc 100%); border-left: 4px solid var(--amber-bd); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: 14px; color: var(--amber-text); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }

  /* 區段標題 */
  .section-h { font-size: 13px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.06em; margin: 18px 0 10px; display: flex; align-items: center; gap: 8px; }
  .section-h::before { content: ''; width: 3px; height: 14px; background: var(--accent); border-radius: 2px; }
  .section-h.pending { color: var(--amber-text); }
  .section-h.pending::before { background: var(--amber-bd); }
  .section-h.closed { color: var(--text3); margin-top: 24px; }
  .section-h.closed::before { background: var(--text3); }

  /* 案件卡 */
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 10px; transition: border-color 0.15s; }
  .card:hover { border-color: var(--border2); }
  .card.pending { border-color: var(--amber-bd); background: linear-gradient(180deg, #fffaee 0%, var(--bg2) 100%); }
  .card.closed { background: var(--bg3); opacity: 0.75; }
  .card.tier2 { border-left: 4px solid var(--red-text); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .card-title { font-weight: 600; font-size: 16px; line-height: 1.4; }
  .card-meta { font-size: 13px; color: var(--text2); margin-top: 4px; line-height: 1.5; }
  .card-body { font-size: 15px; margin-top: 10px; line-height: 1.6; white-space: pre-wrap; }

  .badges { display: flex; gap: 5px; flex-direction: column; align-items: flex-end; }
  .badges-row { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
  .badge { display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
  .b-red { background: var(--red-bg); color: var(--red-text); }
  .b-amber { background: var(--amber-bg); color: var(--amber-text); }
  .b-blue { background: var(--blue-bg); color: var(--blue-text); }
  .b-green { background: var(--green-bg); color: var(--green-text); }
  .b-gray { background: var(--gray-bg); color: var(--text2); }

  .checklist { margin-top: 12px; padding: 10px 12px; background: var(--bg); border-radius: 8px; font-size: 14px; }
  .ck { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
  .ck.done { color: var(--green-text); }
  .ck .dot { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--border2); flex-shrink: 0; transition: all 0.15s; }
  .ck.done .dot { background: var(--green-text); border-color: var(--green-text); position: relative; }
  .ck.done .dot::after { content: ''; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }

  .time-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; padding: 12px; background: var(--bg); border-radius: 8px; font-size: 14px; }
  .tf { display: flex; flex-direction: column; gap: 4px; }
  .tf-label { color: var(--text2); font-size: 12px; font-weight: 500; }
  .tf-value { font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; }
  .tf-value.late { color: var(--red-text); }
  .tf-value.ontime { color: var(--green-text); }
  .tf-value.empty { color: var(--accent); font-weight: 500; cursor: pointer; font-size: 14px; }
  .tf-value.empty:hover { text-decoration: underline; }

  .progress { margin-top: 10px; padding-left: 14px; border-left: 2px solid var(--border); }
  .p-row { font-size: 13px; color: var(--text2); padding: 4px 0; line-height: 1.55; }
  .p-row .p-time { color: var(--text3); margin-right: 8px; font-variant-numeric: tabular-nums; }
  .p-row .p-who { font-weight: 600; color: var(--text); }

  .actions { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .actions button { font-size: 13px; padding: 6px 12px; }

  .add-btn { font-size: 14px; background: transparent; border: 1.5px dashed var(--border2); border-radius: 8px; padding: 12px; width: 100%; color: var(--text2); cursor: pointer; margin-top: 10px; font-weight: 500; transition: all 0.15s; }
  .add-btn:hover { background: var(--accent-bg); border-color: var(--accent); color: var(--accent-d); }
  .empty { font-size: 14px; color: var(--text3); padding: 20px; text-align: center; background: var(--bg2); border-radius: 8px; border: 1px dashed var(--border); }

  /* 守則 */
  .notes-cat { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .notes-cat button { font-size: 13px; padding: 5px 12px; border-radius: 999px; }
  .notes-cat button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .note { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .note .n-cat { font-size: 12px; color: var(--accent-d); font-weight: 600; margin-bottom: 5px; }
  .note .n-title { font-weight: 600; font-size: 16px; }
  .note .n-body { font-size: 14px; margin-top: 8px; line-height: 1.7; white-space: pre-wrap; }
  .note .n-meta { font-size: 12px; color: var(--text3); margin-top: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .note .n-actions button { font-size: 12px; padding: 3px 9px; }

  /* Modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(15,24,32,0.5); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .modal { background: var(--bg2); border-radius: 14px; padding: 22px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
  .modal h2 { font-size: 18px; margin-bottom: 14px; font-weight: 600; }
  .modal-actions { display: flex; gap: 8px; margin-top: 18px; justify-content: flex-end; }

  /* 病人摘要 */
  .patient-info { margin-top: 12px; padding: 12px 14px; background: linear-gradient(180deg, #f0f8fc 0%, #e6f0fb 100%); border-left: 3px solid var(--blue-text); border-radius: 8px; }
  .pi-h { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: var(--blue-text); margin-bottom: 8px; }
  .pi-edit { font-size: 12px; padding: 3px 10px; background: var(--bg2); }
  .pi-grid { display: flex; flex-direction: column; gap: 5px; font-size: 14px; }
  .pi-row { display: flex; gap: 10px; line-height: 1.5; }
  .pi-k { color: var(--text2); flex: 0 0 80px; font-weight: 500; }
  .pi-v { flex: 1; }
  .pi-rec { background: var(--bg2); padding: 2px 8px; border-radius: 4px; font-family: ui-monospace, monospace; font-size: 13px; }
  .pi-copy { font-size: 11px; padding: 2px 7px; margin-left: 5px; }
  .pi-hint { font-size: 12px; color: var(--text3); margin-left: 5px; }
  .pi-empty { font-size: 13px; color: var(--text3); padding: 4px 0; }

  /* 附件 */
  .attach { margin-top: 12px; padding: 12px 14px; background: var(--bg); border-radius: 8px; }
  .att-h { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 10px; }
  .att-add { font-size: 12px; padding: 3px 10px; background: var(--bg2); }
  .att-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .att-item { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 5px; position: relative; }
  .att-item img { width: 100%; height: 100px; object-fit: cover; border-radius: 5px; display: block; }
  .att-file { display: block; padding: 14px 5px; font-size: 13px; text-align: center; text-decoration: none; color: var(--text); word-break: break-all; }
  .att-meta { font-size: 11px; color: var(--text2); margin-top: 5px; line-height: 1.3; word-break: break-all; }
  .att-by { color: var(--text3); }
  .att-del { position: absolute; top: 3px; right: 3px; font-size: 11px; padding: 2px 6px; background: rgba(255,255,255,0.95); border: 1px solid var(--border); }
  .att-empty { font-size: 13px; color: var(--text3); padding: 4px 0; line-height: 1.55; }

  /* 底部固定動作列(取代原 footer) */
  .bottom-bar { position: fixed; bottom: 16px; right: 28px; display: flex; gap: 10px; z-index: 50; }
  .bottom-bar button { padding: 10px 18px; font-size: 14px; border-radius: 999px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); background: var(--bg2); border: 1px solid var(--border); }
  .bottom-bar button.primary { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 4px 16px rgba(0,166,160,0.3); }

  /* Toast */
  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--bg-dark); color: #fff; padding: 10px 20px; border-radius: 999px; font-size: 14px; z-index: 200; opacity: 0; transition: opacity 0.2s; pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
  .toast.show { opacity: 1; }

  .loading { text-align: center; padding: 40px; color: var(--text2); font-size: 15px; }

  /* ======== RWD 手機 ======== */
  @media (max-width: 768px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: sticky; top: 0; z-index: 30; flex-direction: row; align-items: center; padding: 0 12px; }
    .sidebar-brand { padding: 10px 0; border-bottom: none; border-right: 1px solid rgba(255,255,255,0.08); padding-right: 12px; flex-shrink: 0; }
    .sidebar-brand .sub { display: none; }
    .sidebar-nav { padding: 8px 6px; display: flex; gap: 2px; overflow-x: auto; flex-wrap: nowrap; }
    .nav-item { padding: 8px 12px; flex-shrink: 0; font-size: 13px; }
    .nav-item.active::before { display: none; }
    .nav-label { white-space: nowrap; }
    .sidebar-foot { display: none; }
    .main { padding: 16px 14px 100px; }
    .topbar h2 { font-size: 18px; }
    .summary { grid-template-columns: repeat(2, 1fr); }
    .bottom-bar { right: 14px; left: 14px; bottom: 14px; }
    .bottom-bar button { flex: 1; }
  }
</style>

</head>
<body>

<!-- ====== 登入畫面 ====== -->
<div id="login-view" class="login-wrap">
  <div class="login-box">
    <h1>急診 Leader 交班系統</h1>
    <div class="sub">嘉義基督教醫院 · 急診部</div>
    <label>帳號</label>
    <input id="login-username" autocomplete="username">
    <label>密碼</label>
    <input id="login-password" type="password" autocomplete="current-password">
    <button class="primary submit" onclick="doLogin()">登入</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<!-- ====== 主畫面 ====== -->
<div id="app-view" style="display:none;">
  <div class="layout">
    <!-- 左側 sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo">
          <span class="logo-dot"></span>
          <span class="title">Leader 交班系統</span>
        </div>
        <div class="sub">CYCH ED Handover</div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-foot">
        <div class="who"><span id="me-name">—</span><span id="me-role" class="role-tag"></span></div>
        <div id="now" style="margin-top:4px;font-variant-numeric:tabular-nums;">—</div>
        <button onclick="doLogout()">登出</button>
      </div>
    </aside>

    <!-- 主內容區 -->
    <main class="main">
      <div class="topbar">
        <h2 id="page-title">總覽</h2>
        <span class="time" id="now-top">—</span>
      </div>

      <div class="summary" id="summary"></div>
      <div id="pending-bar"></div>
      <div id="panes"></div>
    </main>
  </div>

  <!-- 浮動操作列 -->
  <div class="bottom-bar">
    <button onclick="refreshAll(true)">重新整理</button>
    <button class="primary" onclick="genHandover()">產生交班摘要 ↗</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="modal-root"></div>

<script>
// ====== 設定 ======
const API_URL = 'https://script.google.com/macros/s/AKfycbyUfhENJGp6lcITyAikwXqjwyWqKy5IiPORk7DmwHuo1-K7HB_mQlW_QcmnVbhkCx0T/exec';
const POLL_MS = 30000; // 30 秒輪詢

// ====== State ======
const state = {
  token: null,
  user: null,
  cases: [],
  notes: [],
  activeTab: 'repair',
  notesFilter: { cat: '全部', kw: '' },
  pollTimer: null,
};

const CATS = [
  { id: 'repair',    label: '請修',     hasTracking: true },
  { id: 'leave',     label: '請假',     hasTracking: true },
  { id: 'event',     label: '重大異常', hasTracking: true },
  { id: 'complaint', label: '申訴',     hasTracking: true, tieredLevel: true },
  { id: 'trauma',    label: '無名/重創', hasTracking: true, timed: true },
  { id: 'clinical',  label: '臨床運作', hasTracking: true },
  { id: 'vip',       label: '交辦/VIP', hasTracking: true },
  { id: 'notes',     label: '守則',     isNotes: true },
];

// ====== API ======
async function api(action, payload = {}) {
  const body = { action, token: state.token || '', ...payload };
  // 把所有值 stringify(物件 → JSON 字串)
  const flat = {};
  Object.entries(body).forEach(([k, v]) => {
    if (v === null || v === undefined) return;
    flat[k] = typeof v === 'object' ? JSON.stringify(v) : String(v);
  });
  const params = new URLSearchParams(flat);
  const queryStr = params.toString();

  try {
    let res;
    if (queryStr.length <= 1800) {
      // GET — 大部分動作走這裡
      res = await fetch(`${API_URL}?${queryStr}`, {
        method: 'GET',
        redirect: 'follow',
      });
    } else {
      // POST — 用 form-urlencoded(Apps Script 對這個最友善,不會觸發 redirect bug)
      res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=utf-8' },
        body: queryStr,
        redirect: 'follow',
      });
    }
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch (e) {
      console.error('Bad response:', text.substring(0, 200));
      toast('伺服器回應異常,請通知管理員');
      return null;
    }
    if (data.code === 'AUTH') {
      toast('Session 過期,請重新登入');
      doLogout();
      return null;
    }
    return data;
  } catch (e) {
    toast('網路錯誤:' + e.message);
    return null;
  }
}

// ====== Login ======
async function doLogin() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-err');
  errEl.textContent = '';
  if (!username || !password) { errEl.textContent = '請輸入帳號密碼'; return; }
  const r = await api('login', { username, password });
  if (!r || !r.ok) { errEl.textContent = r ? r.error : '登入失敗'; return; }
  state.token = r.token;
  state.user = r.user;
  localStorage.setItem('handover_token', r.token);
  localStorage.setItem('handover_user', JSON.stringify(r.user));
  showApp();
}

function doLogout() {
  state.token = null;
  state.user = null;
  localStorage.removeItem('handover_token');
  localStorage.removeItem('handover_user');
  if (state.pollTimer) clearInterval(state.pollTimer);
  document.getElementById('login-view').style.display = 'flex';
  document.getElementById('app-view').style.display = 'none';
}

function tryRestoreSession() {
  const token = localStorage.getItem('handover_token');
  const userStr = localStorage.getItem('handover_user');
  if (!token || !userStr) return false;
  try {
    state.token = token;
    state.user = JSON.parse(userStr);
    return true;
  } catch { return false; }
}

async function showApp() {
  document.getElementById('login-view').style.display = 'none';
  document.getElementById('app-view').style.display = 'block';
  document.getElementById('me-name').textContent = state.user.displayName;
  document.getElementById('me-role').textContent = state.user.role === 'approver' ? '可批准' : 'Leader';
  await refreshAll();
  startPolling();
  startClock();
}

// ====== Refresh ======
async function refreshAll(showToast) {
  const r = await api('listAll');
  if (!r || !r.ok) return;
  state.cases = r.cases || [];
  state.notes = r.notes || [];
  renderAll();
  if (showToast) toast('已更新');
}

function startPolling() {
  if (state.pollTimer) clearInterval(state.pollTimer);
  state.pollTimer = setInterval(refreshAll, POLL_MS);
}

function startClock() {
  function tick() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    const t = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    const e1 = document.getElementById('now');
    const e2 = document.getElementById('now-top');
    if (e1) e1.textContent = t;
    if (e2) e2.textContent = t;
  }
  tick(); setInterval(tick, 30000);
}

// ====== Render ======
function isApprover() { return state.user && state.user.role === 'approver'; }
function nowStr() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function prioBadge(p) {
  return p === 'high' ? '<span class="badge b-red">高</span>'
       : p === 'med'  ? '<span class="badge b-amber">中</span>'
       :                '<span class="badge b-gray">低</span>';
}
function stateBadge(s) {
  if (s === 'pending_approval') return '<span class="badge b-amber">待批准</span>';
  if (s === 'closed') return '<span class="badge b-green">已封緘</span>';
  return '';
}
function tierBadge(t) {
  if (t === 2 || t === '2') return '<span class="badge b-red">Tier 2 醫糾風險</span>';
  if (t === 1 || t === '1') return '<span class="badge b-amber">Tier 1 警戒</span>';
  return '';
}
function flagBadges(f) {
  if (!f) return '';
  const out = [];
  if (f.supervisorInvolved) out.push('<span class="badge b-amber">長官介入</span>');
  if (f.lawsuitRisk) out.push('<span class="badge b-red">醫糾風險</span>');
  return out.join(' ');
}
function allChecked(c) {
  return c.checklist && c.checklist.length && c.checklist.every(x => x.done);
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function renderAll() {
  renderSummary();
  renderPendingBar();
  renderTabs();
  renderPanes();
}

function renderSummary() {
  const trackable = CATS.filter(c => c.hasTracking);
  document.getElementById('summary').innerHTML = trackable.map(c => {
    const all = state.cases.filter(x => x.cat === c.id);
    const open = all.filter(x => x.state !== 'closed').length;
    const tier2 = c.id === 'complaint'
      ? all.filter(x => (x.tier === 2 || x.tier === '2') && x.state !== 'closed').length
      : 0;
    const isUrgent = (c.id === 'event' && open > 0) || tier2 > 0;
    return `<div class="stat ${isUrgent ? 'urgent' : ''}" onclick="switchTab('${c.id}')">
      <div class="l">${c.label}</div>
      <div class="n">${open}<span class="total"> / ${all.length}</span></div>
    </div>`;
  }).join('');
}

function renderPendingBar() {
  const pending = state.cases.filter(x => x.state === 'pending_approval');
  if (!pending.length) { document.getElementById('pending-bar').innerHTML = ''; return; }
  const tip = isApprover()
    ? `<button onclick="switchToFirstPending()">前往批准</button>`
    : `<span style="font-size:12px;">等待護理長/副護理長批准</span>`;
  document.getElementById('pending-bar').innerHTML = `
    <div class="pending-bar">
      <span><strong>${pending.length}</strong> 件案件待批准封緘</span>
      ${tip}
    </div>`;
}

// 圖示(極簡 SVG,不依賴外部圖示庫)

};

function renderTabs() {
  document.getElementById('sidebar-nav').innerHTML = CATS.map(c => {
    const open = c.hasTracking ? state.cases.filter(x => x.cat === c.id && x.state !== 'closed').length : 0;
    return `<div class="nav-item ${state.activeTab === c.id ? 'active' : ''}" onclick="switchTab('${c.id}')">
      ${NAV_ICONS[c.id] || ''}
      <span class="nav-label">${c.label}</span>
      ${open ? `<span class="nav-badge">${open}</span>` : ''}
    </div>`;
  }).join('');
  // 同步頂部標題
  const cur = CATS.find(x => x.id === state.activeTab);
  if (cur) document.getElementById('page-title').textContent = cur.label;
}

function renderPanes() {
  const catId = state.activeTab;
  const cat = CATS.find(x => x.id === catId);
  document.getElementById('panes').innerHTML = `<div id="pane-${catId}"></div>`;
  if (cat.isNotes) renderNotesPane();
  else renderPane(catId);
}

function renderPane(catId) {
  const items = state.cases.filter(x => x.cat === catId);
  const pending = items.filter(x => x.state === 'pending_approval').sort((a,b) => String(b.created).localeCompare(String(a.created)));
  const open    = items.filter(x => x.state === 'open').sort((a,b) => String(b.created).localeCompare(String(a.created)));
  const closed  = items.filter(x => x.state === 'closed').sort((a,b) => String(b.closedAt||'').localeCompare(String(a.closedAt||'')));

  let html = '';
  if (pending.length) {
    html += `<div class="section-h pending">待批准封緘 (${pending.length})</div>`;
    html += pending.map(cardHTML).join('');
  }
  html += `<div class="section-h">未結案 (${open.length})</div>`;
  html += open.length ? open.map(cardHTML).join('') : '<div class="empty">沒有未結案件</div>';
  html += `<button class="add-btn" onclick="openAddCase('${catId}')">+ 新增${CATS.find(x=>x.id===catId).label}案件</button>`;
  if (closed.length) {
    html += `<div class="section-h closed">已封緘 (${closed.length})</div>`;
    html += closed.map(cardHTML).join('');
  }
  document.getElementById('pane-'+catId).innerHTML = html;
}

function cardHTML(c) {
  const stateClass = c.state === 'pending_approval' ? 'pending' : c.state === 'closed' ? 'closed' : '';
  const tierClass = (c.tier === 2 || c.tier === '2') ? 'tier2' : '';
  return `<div class="card ${stateClass} ${tierClass}">
    <div class="card-top">
      <div style="flex:1; min-width:0;">
        <div class="card-title">${escapeHtml(c.title)}</div>
        <div class="card-meta">${escapeHtml(c.subType)} · ${escapeHtml(c.meta)} · 取得 ${escapeHtml(String(c.created).split(' ')[0])}</div>
      </div>
      <div class="badges">${prioBadge(c.priority)}${stateBadge(c.state)}</div>
    </div>
    <div class="badges-row">${tierBadge(c.tier)}${flagBadges(c.flags)}</div>
    <div class="card-body">${escapeHtml(c.detail)}</div>
    ${patientInfoHTML(c)}
    ${timelineHTML(c)}
    ${checklistHTML(c)}
    ${attachmentsHTML(c)}
    ${progressHTML(c.progress)}
    ${c.state === 'closed'
      ? `<div class="card-meta" style="margin-top:8px;">已封緘 ${escapeHtml(c.closedAt)} · 批准:${escapeHtml(c.closedBy)}</div>`
      : actionsHTML(c)}
    <div class="card-meta" style="margin-top:6px;">負責人:<strong>${escapeHtml(c.owner)}</strong></div>
  </div>`;
}

// ----- 病人摘要(去識別化) -----
const PATIENT_CATS = ['event', 'complaint', 'trauma', 'vip'];

function patientInfoHTML(c) {
  if (PATIENT_CATS.indexOf(c.cat) < 0) return '';
  const pi = c.patientInfo || {};
  const recordNo = c.recordNo || '';
  const hasData = pi.bed || pi.demographic || pi.vitalSigns || pi.chiefComplaint ||
                  pi.mobility || pi.companion || pi.transferStatus || pi.pmh ||
                  pi.travelHx || pi.dx || pi.management || pi.timing || recordNo;

  if (!hasData && c.state === 'closed') return '';

  const fields = [
    ['床號',      pi.bed || ''],
    ['性別/年齡', pi.demographic || ''],
    ['生命徵象', pi.vitalSigns || ''],
    ['主訴',     pi.chiefComplaint || ''],
    ['活動度',   pi.mobility || ''],
    ['陪同',     pi.companion || ''],
    ['轉院',     pi.transferStatus || ''],
    ['病史',     pi.pmh || ''],
    ['旅遊史',   pi.travelHx || ''],
    ['Dx 印象',  pi.dx || ''],
    ['目前處置', pi.management || ''],
    ['關鍵時序', pi.timing || ''],
  ];

  const editable = c.state !== 'closed';

  return `<div class="patient-info">
    <div class="pi-h">病人摘要(去識別化)
      ${editable ? `<button class="pi-edit" onclick="openPatientInfo('${c.id}')">編輯</button>` : ''}
    </div>
    ${hasData ? `
      <div class="pi-grid">
        ${fields.filter(([_,v]) => v).map(([k,v]) => `
          <div class="pi-row"><span class="pi-k">${k}</span><span class="pi-v">${escapeHtml(v)}</span></div>
        `).join('')}
        ${recordNo ? `
          <div class="pi-row">
            <span class="pi-k">NIS 病歷號</span>
            <span class="pi-v"><code class="pi-rec">${escapeHtml(recordNo)}</code>
              <button class="pi-copy" onclick="copyText('${escapeHtml(recordNo)}')">複製</button>
              <span class="pi-hint">詳情查 NIS</span>
            </span>
          </div>` : ''}
      </div>
    ` : `<div class="pi-empty">尚未填寫,點「編輯」新增。請勿輸入完整姓名或可識別資訊。</div>`}
  </div>`;
}

// ----- 附件區 -----
const ATTACH_CATS = ['repair', 'event', 'clinical'];

function attachmentsHTML(c) {
  if (ATTACH_CATS.indexOf(c.cat) < 0) return '';
  const list = c.attachments || [];
  const editable = c.state !== 'closed';

  return `<div class="attach">
    <div class="att-h">📎 設備/現場照 (${list.length})
      ${editable ? `<button class="att-add" onclick="openUpload('${c.id}')">+ 上傳</button>` : ''}
    </div>
    ${list.length ? `
      <div class="att-grid">
        ${list.map(a => attachItemHTML(c.id, a, editable)).join('')}
      </div>
    ` : `<div class="att-empty">無附件。⚠️ 請勿上傳含病人姓名、病歷號之影像</div>`}
  </div>`;
}

function attachItemHTML(caseId, a, editable) {
  const isImage = a.mimeType && a.mimeType.startsWith('image/');
  const thumbUrl = `https://drive.google.com/thumbnail?id=${a.id}&sz=w200`;
  const viewUrl  = `https://drive.google.com/file/d/${a.id}/view`;
  return `<div class="att-item">
    ${isImage
      ? `<a href="${viewUrl}" target="_blank"><img src="${thumbUrl}" loading="lazy" alt="${escapeHtml(a.name)}"></a>`
      : `<a href="${viewUrl}" target="_blank" class="att-file">📄 ${escapeHtml(a.name)}</a>`
    }
    <div class="att-meta">${escapeHtml(a.name)}<br><span class="att-by">${escapeHtml(a.uploadedBy)} · ${escapeHtml(String(a.uploadedAt).split(' ')[1] || a.uploadedAt)}</span></div>
    ${editable ? `<button class="att-del" onclick="deleteAttachment('${caseId}','${a.id}')">刪除</button>` : ''}
  </div>`;
}

function copyText(t) {
  navigator.clipboard.writeText(t).then(() => toast('已複製:' + t)).catch(() => toast('複製失敗'));
}

function checklistHTML(c) {
  if (!c.checklist || !c.checklist.length) return '';
  const disabled = c.state === 'closed';
  return `<div class="checklist">${
    c.checklist.map(it => `
      <div class="ck ${it.done ? 'done' : ''}" ${disabled ? '' : `onclick="toggleCheck('${c.id}','${it.id}')"`}>
        <span class="dot"></span>
        <span>${escapeHtml(it.label)}${it.note ? ` — <em style="color:var(--text2);font-style:normal;">${escapeHtml(it.note)}</em>` : ''}</span>
      </div>`).join('')
  }</div>`;
}

function timelineHTML(c) {
  if (!c.timeline) return '';
  const tl = c.timeline;
  const fmt = (val, status, fld) => {
    if (!val) return `<span class="tf-value empty" onclick="setTraumaTime('${c.id}','${fld}')">點此記錄到達</span>`;
    const cls = status === 'ontime' ? 'ontime' : status === 'late' ? 'late' : '';
    return `<span class="tf-value ${cls}">${escapeHtml(String(val).split(' ')[1] || val)}</span>`;
  };
  return `<div class="time-fields">
    <div class="tf"><span class="tf-label">抵院時間</span><span class="tf-value">${escapeHtml(String(tl.arrival||'').split(' ')[1] || tl.arrival || '—')}</span></div>
    ${tl.traumaDr_required && tl.traumaDr_required !== '-' ? `
      <div class="tf"><span class="tf-label">外傷醫師(${escapeHtml(tl.traumaDr_required)})</span>${fmt(tl.traumaDr_actual, tl.traumaDr_status, 'traumaDr_actual')}</div>
    ` : ''}
    ${tl.sw_required && tl.sw_required !== '-' ? `
      <div class="tf"><span class="tf-label">社工(${escapeHtml(tl.sw_required)})</span>${fmt(tl.sw_actual, tl.sw_status, 'sw_actual')}</div>
    ` : ''}
  </div>`;
}

function progressHTML(p) {
  if (!p || !p.length) return '';
  const items = p.slice().reverse().slice(0, 3);
  return `<div class="progress">${
    items.map(x => `<div class="p-row"><span class="p-time">${escapeHtml(x.time)}</span><span class="p-who">${escapeHtml(x.who)}</span> · ${escapeHtml(x.text)}</div>`).join('')
  }${p.length > 3 ? `<div class="p-row" style="color:var(--text3);">…還有 ${p.length-3} 筆</div>` : ''}</div>`;
}

function actionsHTML(c) {
  if (c.state === 'pending_approval') {
    return `<div class="actions">
      ${isApprover()
        ? `<button class="primary" onclick="approveCase('${c.id}')">批准封緘</button>`
        : `<button disabled>需護理長/副護理長批准</button>`}
      <button onclick="unsubmit('${c.id}')">退回繼續處理</button>
    </div>`;
  }
  const ready = allChecked(c);
  return `<div class="actions">
    <button onclick="openAddProgress('${c.id}')">加註進度</button>
    <button onclick="takeOver('${c.id}')">${c.owner === state.user.displayName ? '已是我' : '接手'}</button>
    ${c.cat === 'complaint' && (c.tier === 1 || c.tier === '1') ? `<button class="danger" onclick="escalateTier('${c.id}')">升 Tier 2</button>` : ''}
    ${c.cat === 'complaint' && (c.tier === 2 || c.tier === '2') ? `<button class="danger" onclick="convertToEvent('${c.id}')">轉重大異常</button>` : ''}
    <button class="${ready ? 'primary' : ''}" onclick="submitForApproval('${c.id}')">送批准</button>
  </div>`;
}

// ====== Notes ======
function renderNotesPane() {
  const allCats = ['全部', ...new Set(state.notes.map(n => n.cat).filter(Boolean))];
  const f = state.notesFilter;
  const filtered = state.notes.filter(n =>
    (f.cat === '全部' || n.cat === f.cat) &&
    (f.kw === '' || (n.title||'').includes(f.kw) || (n.body||'').includes(f.kw) || (n.cat||'').includes(f.kw))
  );
  document.getElementById('pane-notes').innerHTML = `
    <input type="text" id="notes-kw" placeholder="搜尋守則..." value="${escapeHtml(f.kw)}" oninput="onNotesKw(this.value)">
    <div class="notes-cat" style="margin-top:10px;">
      ${allCats.map(c => `<button class="${c === f.cat ? 'active' : ''}" onclick="setNotesCat('${escapeHtml(c)}')">${escapeHtml(c)}</button>`).join('')}
    </div>
    ${filtered.length ? filtered.map(n => `
      <div class="note">
        <div class="n-cat">${escapeHtml(n.cat)}</div>
        <div class="n-title">${escapeHtml(n.title)}</div>
        <div class="n-body">${escapeHtml(n.body)}</div>
        <div class="n-meta">
          <span>${escapeHtml(n.author)} · 更新 ${escapeHtml(n.updated)}</span>
          <span class="n-actions">
            <button onclick="openEditNote('${n.id}')">編輯</button>
            <button class="danger" onclick="deleteNote('${n.id}')">刪除</button>
          </span>
        </div>
      </div>
    `).join('') : '<div class="empty">查無相關守則</div>'}
    <button class="add-btn" onclick="openAddNote()">+ 新增守則</button>
  `;
}

function onNotesKw(v) { state.notesFilter.kw = v; renderNotesPane();
  // 保留游標
  const el = document.getElementById('notes-kw');
  if (el) { el.focus(); el.setSelectionRange(v.length, v.length); }
}
function setNotesCat(c) { state.notesFilter.cat = c; renderNotesPane(); }

// ====== Actions ======
function switchTab(catId) {
  state.activeTab = catId;
  const cur = CATS.find(x => x.id === catId);
  if (cur) document.getElementById('page-title').textContent = cur.label;
  renderTabs();
  renderPanes();
  // 手機:點分頁後捲到頂部
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function switchToFirstPending() {
  const p = state.cases.find(x => x.state === 'pending_approval');
  if (p) switchTab(p.cat);
}

async function toggleCheck(caseId, itemId) {
  const r = await api('toggleCheck', { caseId, itemId });
  if (r && r.ok) refreshAll();
}

async function takeOver(caseId) {
  const c = state.cases.find(x => x.id === caseId);
  if (c && c.owner === state.user.displayName) return;
  const r = await api('takeOver', { caseId });
  if (r && r.ok) refreshAll();
}

async function submitForApproval(caseId) {
  const c = state.cases.find(x => x.id === caseId);

async function parseTriage(caseId) {
  const text = document.getElementById('m-pi-raw').value.trim();
  if (!text) { toast('請先貼上檢傷紀錄文字'); return; }
  if (text.length > 8000) { toast('文字過長,請精簡'); return; }

  // 提醒去識別化
  if (!confirm('確認:你已從文字中刪除「姓名、身分證號、病歷號」等個資?\n\n貼上的原文不會被儲存,只會用於這次 AI 解析。')) return;

  document.getElementById('m-pi-parsing').style.display = 'block';
  const r = await api('parseTriage', { text, caseId });
  document.getElementById('m-pi-parsing').style.display = 'none';

  if (!r || !r.ok) { toast(r ? r.error : '解析失敗'); return; }

  const p = r.parsed || {};
  // 把結果填入欄位(只填空欄位,不覆蓋已有的內容)
  function setIfEmpty(id, val) {
    const el = document.getElementById(id);
    if (el && val && !el.value.trim()) el.value = val;
  }
  setIfEmpty('m-pi-bed',    p.bed);
  setIfEmpty('m-pi-demo',   p.demographic);
  setIfEmpty('m-pi-vs',     p.vitalSigns);
  setIfEmpty('m-pi-cc',     p.chiefComplaint);
  setIfEmpty('m-pi-mob',    p.mobility);
  setIfEmpty('m-pi-comp',   p.companion);
  setIfEmpty('m-pi-trans',  p.transferStatus);
  setIfEmpty('m-pi-pmh',    p.pmh);
  setIfEmpty('m-pi-travel', p.travelHx);
  setIfEmpty('m-pi-dx',     p.dx);
  setIfEmpty('m-pi-mgmt',   p.management);
  setIfEmpty('m-pi-timing', p.timing);

  // 解析完清空原文(降低殘留風險)
  document.getElementById('m-pi-raw').value = '';
  toast('解析完成,請檢查內容');
}

function openUpload(caseId) {
  showModal('上傳設備/現場照', `
    <div style="background:var(--red-bg);color:var(--red-text);padding:10px 12px;border-radius:6px;font-size:12px;margin-bottom:12px;line-height:1.6;">
      ⚠️ <strong>嚴禁上傳含病人資料之影像</strong><br>
      • 不可:檢傷紀錄、心電圖、影像報告、病歷文件、身分證件<br>

    <label>選擇圖片或檔案</label>
    <input type="file" id="m-up-file" accept="image/*,application/pdf">
    <label>備註(可選)</label>
    <input id="m-up-note" placeholder="例:急救室 #2 監視器黑屏狀態">
    <div id="m-up-preview" style="margin-top:10px;"></div>
  `, async () => {
    const fileInput = document.getElementById('m-up-file');
    if (!fileInput.files || !fileInput.files[0]) { toast('請選擇檔案'); return false; }
    const file = fileInput.files[0];
    if (file.size > 8 * 1024 * 1024) { toast('檔案大於 8 MB,請壓縮後再上傳'); return false; }
    const note = document.getElementById('m-up-note').value.trim();
    toast('上傳中...');
    const fileBase64 = await fileToBase64(file);
    const r = await api('uploadAttachment', {
      caseId, fileName: file.name, mimeType: file.type, fileBase64, note,
    });
    if (r && r.ok) { toast('上傳成功'); refreshAll(); return true; }
    toast(r ? r.error : '上傳失敗'); return false;
  });

  // 預覽
  setTimeout(() => {
    const fi = document.getElementById('m-up-file');
    if (!fi) return;
    fi.addEventListener('change', () => {
      const f = fi.files[0];
      const prev = document.getElementById('m-up-preview');
      if (!f) { prev.innerHTML = ''; return; }
      if (f.type.startsWith('image/')) {
        const url = URL.createObjectURL(f);
        prev.innerHTML = `<img src="${url}" style="max-width:100%;max-height:200px;border-radius:6px;">`;
      } else {
        prev.innerHTML = `<div style="font-size:13px;color:var(--text2);">📄 ${escapeHtml(f.name)} (${(f.size/1024).toFixed(0)} KB)</div>`;
      }
    });
  }, 100);
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result;
      // result is "data:mime;base64,XXXX",取後半
      const base64 = result.split(',')[1];
      resolve(base64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ====== 交班摘要 ======
function genHandover() {
  const me = state.user.displayName;
  const now = nowStr();
  let txt = `急診 Leader 交班摘要\n交班人:${me}\n時間:${now}\n${'='.repeat(40)}\n\n`;

  // 待批准
  const pending = state.cases.filter(x => x.state === 'pending_approval');
  if (pending.length) {
    txt += `🔶 待批准封緘 (${pending.length} 件)\n`;
    pending.forEach(c => txt += `  • [${CATS.find(x=>x.id===c.cat).label}] ${c.title} — ${c.owner}\n`);
    txt += '\n';
  }

  // 高優 / 醫糾 / 長官
  const critical = state.cases.filter(x => x.state === 'open' && (
    x.priority === 'high' ||
    (x.flags && (x.flags.lawsuitRisk || x.flags.supervisorInvolved)) ||
    x.tier === 2 || x.tier === '2'
  ));
  if (critical.length) {
    txt += `🔴 高優先 / 醫糾 / 長官介入 (${critical.length} 件)\n`;
    critical.forEach(c => {
      const tags = [];
      if (c.flags && c.flags.lawsuitRisk) tags.push('醫糾');
      if (c.flags && c.flags.supervisorInvolved) tags.push('長官');
      if (c.tier === 2 || c.tier === '2') tags.push('Tier2');
      txt += `  • [${CATS.find(x=>x.id===c.cat).label}] ${c.title}${tags.length?` 〔${tags.join(',')}〕`:''} — ${c.owner}\n`;
      const lastP = c.progress && c.progress[c.progress.length-1];
      if (lastP) txt += `    最新進度:${lastP.text}\n`;
    });
    txt += '\n';
  }

  // 各類別未結案
  CATS.filter(c => c.hasTracking).forEach(cat => {
    const open = state.cases.filter(x => x.cat === cat.id && x.state === 'open');
    if (!open.length) return;
    txt += `▸ ${cat.label} (${open.length} 件未結)\n`;
    open.forEach(c => txt += `  • ${c.title} — ${c.owner}\n`);
    txt += '\n';
  });

  // 顯示
  showModal('交班摘要', `
    <textarea style="min-height:300px;font-family:monospace;font-size:12px;" readonly>${escapeHtml(txt)}</textarea>
    <div style="font-size:12px;color:var(--text2);margin-top:8px;">可全選複製貼到 LINE / Email</div>
  `, async () => {
    try { await navigator.clipboard.writeText(txt); toast('已複製到剪貼簿'); } catch {}
    return true;
  });
}

// ====== Toast ======
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

// ====== 初始化 ======
window.addEventListener('DOMContentLoaded', async () => {
  if (tryRestoreSession()) {
    // 驗證 session 是否還有效
    const r = await api('listAll');
    if (r && r.ok) { showApp(); return; }
    doLogout();
  }
  document.getElementById('login-password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
});
</script>
